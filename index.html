<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';

document.body.prepend(renderer.domElement);

const camera = new THREE.PerspectiveCamera(innerWidth < innerHeight ? 80 : 62, innerWidth / innerHeight, 0.05, 600);

const composer = new EffectComposer(renderer);

// ---------- helpers ----------
let root = scene;                       // 지금 만들고 있는 장면 그룹
const mats = {};

function outline(mesh) {

}
const add = (m, x = 0, y = 0, z = 0) => { m.position.set(x, y, z); root.add(m); return m; };
// box by min/max corners
function bx(x0, x1, y0, y1, z0, z1, color, edges = true, m = mat(color)) {
  const mesh = add(new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x1 - x0), Math.abs(y1 - y0), Math.abs(z1 - z0)), m),
    (x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);

}

function canvasTex(w, h, draw, repeat = false) {

  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;

}
function texMat(tex, color, rx, ry) {

}
function glossMat(tex, color, rx, ry) {   // 조명이 비치는 매끈한 바닥

  m.rotation.y = ry;

}
const DOT = canvasTex(64, 64, (g) => {

  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
});

const R = 3, X0 = -16, X1 = -4, Z0 = -2, Z1 = -45;
function footprint(o) {                     // shape y = -world z
  const s = new THREE.Shape();
  s.moveTo(X0, -Z0 - o);
  s.lineTo(X1 - R, -Z0 - o);
  s.absarc(X1 - R, -Z0 + R, R + o, -Math.PI / 2, 0, false);
  s.lineTo(X1 + o, -Z1);
  s.lineTo(X0, -Z1);
  s.closePath();
  return s;
}
function prism(shape, y0, h, m) {
  const g = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false, curveSegments: 24 });
  g.rotateX(-Math.PI / 2);

}

for (let z = -4; z > -44; z -= 3.2) {       // 캐노피 아래 다운라이트

// 1층

const EL = { xa: -6.75, xb: -8.45, back: -17.3, y1: LY + 2.2 }, exc = (EL.xa + EL.xb) / 2;
bx(X0, -7, 0, 4.4, -3.5, -13.2, 0x30323a);                 // 모서리 쪽: 캐노피 아래로 들어간 어두운 패널 벽
for (let z = -4.7; z > -13; z -= 1.2) bx(-7, -6.985, 0, 4.3, z, z - 0.02, 0x1f2026, false);
for (let x = -8.2; x > -15.5; x -= 1.2) bx(x, x - 0.02, 0, 4.3, -3.5, -3.485, 0x1f2026, false);
bx(-13.5, -9.6, 0.9, 1.5, -3.5, -3.46, 0, true, glow(0x2c313c));   // 정면 낮은 가로창
bx(X0, -5.5, 0, 4.4, -13.2, EL.back, C.ground1);            // 간판이 붙은 튀어나온 벽
bx(X0, -5.5, 0, 4.4, EZ1, Z1, C.ground1);

bx(EL.xa, EL.xb, 0, LY - 0.1, EL.back, EZ0, C.ground1, false);
for (const [z0, z1] of [[-29, -33], [-36, -41]]) bx(-5.5, -5.35, 0.6, 3.6, z0, z1, 0, true, glow(0x131a2c));

function louvers(offset, step, y0, y1, m, depth, phase = 0) {
  const pts = [], r = R + offset, cx = X1 - R, cz = Z0 - R;
  for (let x = X0 + 0.3 + phase; x < cx; x += step) pts.push([x, Z0 + offset, 0]);
  for (let a = phase / r; a < Math.PI / 2; a += step / r) pts.push([cx + r * Math.sin(a), cz + r * Math.cos(a), a]);
  for (let z = cz - phase; z > Z1 + 0.3; z -= step) pts.push([X1 + offset, z, Math.PI / 2]);
  const inst = new THREE.InstancedMesh(new THREE.BoxGeometry(0.09, y1 - y0, depth), m, pts.length);
  const o = new THREE.Object3D();
  pts.forEach(([x, z, a], i) => { o.position.set(x, (y0 + y1) / 2, z); o.rotation.y = a; o.updateMatrix(); inst.setMatrixAt(i, o.matrix); });
  add(inst);
}
louvers(0.2, 0.45, 5.6, 12.8, new THREE.MeshLambertMaterial({ color: 0x8f1d30, emissive: 0x26050d }), 0.6);
louvers(0.75, 1.1, 5.0, 15, mat(0xa5a2ab), 0.22, 0.5);

// 계단 + 랜딩
const STONE = 0x77757c, SZ = -21.2;      // SZ: 계단 남쪽 끝 (그 남쪽은 경사로 끝 단)
for (let i = 0; i < 6; i++) bx(-2.5 - i * 0.42, -2.92 - i * 0.42, 0, (i + 1) * 0.2, SZ, EZ1, STONE);
bx(-5.02, -9, 0, LY, EZ0, EZ1, STONE);

// 간판
const signTex = canvasTex(1024, 256, () => {});

  g.font = '700 48px "Noto Sans KR", sans-serif'; g.fillText('Student Union', 650, 96);

// 로비 유리문 + 자판기 (자판기는 북쪽 벽에 붙어 남쪽을 봄)
bx(-9.08, -9, LY, 4.4, -20.2, -26.3, 0, true, glow(0x3b3b42));

const PX0 = -5.5, PX1 = -4.2, PZ0 = -5, PZ1 = -17.5;
{ const sh = new THREE.Shape(); sh.moveTo(0, 0); sh.lineTo(PZ0 - PZ1, 0); sh.lineTo(PZ0 - PZ1, LY); sh.closePath();

const bal = [];
function beam(a, b, t, color) {
  const m = add(new THREE.Mesh(new THREE.BoxGeometry(t, t, a.distanceTo(b)), mat(color)));
  m.position.copy(a).add(b).multiplyScalar(0.5); m.lookAt(b); return m;
}
function railing(a, b) {                   // 위·아래 가로대 + 촘촘한 세로 살 + 양 끝 기둥
  const up = y => V(0, y, 0);
  beam(a.clone().add(up(1.0)), b.clone().add(up(1.0)), 0.05, C.steel);
  beam(a.clone().add(up(0.1)), b.clone().add(up(0.1)), 0.03, C.steel);
  for (const q of [a, b]) bx(q.x - 0.03, q.x + 0.03, q.y, q.y + 1.0, q.z - 0.03, q.z + 0.03, C.steel, false);
  const n = Math.ceil(a.distanceTo(b) / 0.13);
  for (let i = 1; i < n; i++) bal.push(a.clone().lerp(b, i / n));
}

{ const inst = new THREE.InstancedMesh(new THREE.BoxGeometry(0.018, 0.9, 0.018), mat(C.steel), bal.length), o = new THREE.Object3D();

const smooth = (r, v) => { const t = lin(r, v); return t * t * (3 - 2 * t); };

const pos = V(0, 0, 0), look = V(0, 0, 0), tmpL = V(0, 0, 0);
let roomLvl = 0;
function place(p) {
  const out = p < T.swap;
  outside.visible = out; inside.visible = !out;
  scene.background = out ? skyTex : inBg;
  scene.fog = out ? extFog : inFog;
  if (out) {
    extPath(lin(T.walk, p), pos, look);
    const e = smooth(T.enter1, p);
    pos.lerp(extCarPos, e); look.lerp(extCarLook, e);
    const o = smooth(T.open1, p);
    doorA.position.x = doorAx + o * (half - 0.05);
    doorB.position.x = doorBx - o * (half - 0.05);
    carLight.intensity = o * 2;
    roomLvl = 0;
  } else {
    inPath(lin(T.walk2, p), pos, look);
    const o2 = smooth(T.open2, p);
    carDoors.forEach((d, i) => (d.position.x = carDoorX[i] + (i ? 1 : -1) * o2 * 0.48));
    door305.rotation.y = -smooth(T.open3, p) * 1.75;
    const e = smooth(T.enter3, p), s = smooth(T.settle, p);
    pos.lerp(roomA, e); look.lerp(tmpL.copy(roomALook), e);
    pos.lerp(roomB, s); look.lerp(roomBLook, s);
    const spill = smooth(T.open3, p);                  // 문 틈으로 쏟아지는 빛
    roomLvl = smooth([0.86, 0.92], p);                 // 들어서면 확 밝아짐
    roomLights.forEach(l => (l.intensity = spill * 9));
    roomHemi.intensity = roomLvl * 2.4;
    inFog.far = 24 + roomLvl * 300;
  }
  const wk = out ? lin(T.walk, p) : lin(T.walk2, p);           // 걸을 때 살짝 흔들림
  pos.y += Math.sin(p * 900) * 0.018 * Math.min(1, wk * 20, (1 - wk) * 20);
  camera.position.copy(pos);
  camera.lookAt(look);
  camera.rotateY(-mouse.x * 0.07);
  camera.rotateX(-mouse.y * 0.04);
}

// ---------- 입력: 휠 / 드래그 / 터치 / 키보드 ----------
// 페이지 스크롤과 같은 방향: 휠 아래, 손가락·마우스를 위로 끌면 앞으로
let target = 0, prog = 0;
const mouse = { x: 0, y: 0 }, mouseT = { x: 0, y: 0 };
const nudge = d => (target = clamp(target + d));
addEventListener('wheel', e => { e.preventDefault(); nudge(e.deltaY * 0.00018); }, { passive: false });
let dragY = null;
addEventListener('pointerdown', e => { dragY = e.clientY; document.body.classList.add('drag'); });
addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') { mouseT.x = e.clientX / innerWidth * 2 - 1; mouseT.y = e.clientY / innerHeight * 2 - 1; }
  if (dragY === null) return;
  nudge((dragY - e.clientY) / innerHeight * 0.2);
  dragY = e.clientY;
});
const endDrag = () => { dragY = null; document.body.classList.remove('drag'); };
addEventListener('pointerup', endDrag);
addEventListener('pointercancel', endDrag);
addEventListener('keydown', e => {
  const k = { ArrowDown: 1, PageDown: 3, ' ': 3, ArrowUp: -1, PageUp: -3 }[e.key];
  if (k) { e.preventDefault(); nudge(k * 0.015); }
});

// ---------- UI ----------
const panels = [...document.querySelectorAll('.panel')].map(el => ({ el, r: el.dataset.range.split(',').map(Number) }));
const $ = id => document.getElementById(id);
const hint = $('hint'), bar = $('bar'), black = $('black'), flash = $('flash'), vignette = $('vignette'), cool = $('cool');

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 1 ? 80 : 62;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
document.fonts.ready.then(drawSign);
drawSign();

window.__go = v => (target = prog = v); // 디버그용: __go(0.5)

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  prog += (target - prog) * 0.08;
  mouse.x += (mouseT.x - mouse.x) * 0.05;
  mouse.y += (mouseT.y - mouse.y) * 0.05;
  place(prog);

  if (outside.visible) {
    starsA.material.opacity = 0.55 + 0.45 * Math.sin(t * 1.3);
    starsB.material.opacity = 0.55 + 0.45 * Math.sin(t * 0.9 + 2);
    shapes.forEach((s, i) => { s.rotation.x += dt * 0.15; s.rotation.y += dt * (0.1 + i * 0.03); s.position.y = s.userData.y + Math.sin(t * 0.6 + i) * 0.6; });
    for (let i = 0; i < SNOW; i++) {
      const y = snowPos[i * 3 + 1] - dt * (0.7 + (i % 7) * 0.12);
      snowPos[i * 3 + 1] = y < 0 ? 24 : y;
      snowPos[i * 3] += Math.sin(t * 0.8 + i) * dt * 0.25;
      snowPos[i * 3 + 2] += Math.cos(t * 0.6 + i * 0.7) * dt * 0.15;
    }
    snowGeo.attributes.position.needsUpdate = true;
  } else if (roomLvl > 0) {
    people.forEach((p, i) => { p.position.y = p.userData.y + Math.abs(Math.sin(t * 3.2 + i * 1.3)) * 0.035; p.rotation.z = Math.sin(t * 1.6 + i) * 0.03; });
  }

  bloom.strength = outside.visible ? 0.4 : 0.55 - roomLvl * 0.45;
  for (const { el, r } of panels) el.classList.toggle('on', prog >= r[0] && prog < r[1]);
  hint.style.opacity = prog < 0.01 ? 1 : 0;
  bar.style.transform = `scaleX(${prog})`;
  black.style.opacity = Math.min(smooth([0.36, 0.39], prog), 1 - smooth([0.43, 0.46], prog));
  flash.style.opacity = smooth([0.85, 0.88], prog) * (1 - smooth([0.88, 0.94], prog)) * 0.9;
  vignette.style.opacity = 1 - roomLvl * 0.6;
  cool.style.opacity = outside.visible ? 0.22 : 0.12 - roomLvl * 0.1;   // 바깥은 차갑게, 방 안은 중성 흰빛
  composer.render();
});
</script>
</body>
</html>
